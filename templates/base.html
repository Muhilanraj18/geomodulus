<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}GeoModulus AI{% endblock %}
    </title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <!-- GeoModulus CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>

    <!-- =====================================================
         NAVBAR
         ===================================================== -->

    <nav class="geo-navbar">

        <div class="geo-navbar-inner">

            <a href="/" class="geo-brand">
                <i class="bi bi-globe2"></i>
                GeoModulus AI
            </a>


            <div class="geo-nav-links">

                <a href="/">
                    <i class="bi bi-grid"></i>
                    Dashboard
                </a>

                <a href="/predict">
                    <i class="bi bi-cpu"></i>
                    Prediction
                </a>

                <a href="/about">
                    <i class="bi bi-info-circle"></i>
                    About
                </a>

            </div>

        </div>

    </nav>


    <!-- =====================================================
         MAIN CONTENT
         ===================================================== -->

    <main class="geo-main">

        <div class="geo-container">

            {% block content %}
            {% endblock %}

        </div>

    </main>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer class="geo-footer">

        <div class="geo-container">

            <p>
                GeoModulus AI
                <span>•</span>
                AI-powered soil elastic modulus prediction
                and engineering decision support.
            </p>

        </div>

    </footer>


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Project JavaScript -->

    <script
        src="{{ url_for('static', filename='js/script.js') }}">
    </script>


</body>

</html>
